# SPDX-License-Identifier: GPL-2.0-only
name: iOS Qt 5 build and simulator
on:
  push:
    branches: [feature-ios-*]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ios:
    name: iOS ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        target: [simulator, device]
    concurrency:
      group: ios-${{ github.ref }}-${{ matrix.target }}
      cancel-in-progress: true
    runs-on: macos-15-intel
    timeout-minutes: 60
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Record build environment
        run: |
          git rev-parse HEAD HEAD^{tree}
          xcodebuild -version
          xcrun simctl list runtimes
      - name: Install Qt 5.15.2 iOS tools and libraries
        run: |
          python3 -m venv "$RUNNER_TEMP/aqt-venv"
          "$RUNNER_TEMP/aqt-venv/bin/pip" install aqtinstall==3.3.0
          "$RUNNER_TEMP/aqt-venv/bin/python" -m aqt install-qt mac ios 5.15.2 ios \
            --outputdir "$RUNNER_TEMP/Qt" --archives qtbase qtsvg qtspeech
          echo "QT5_IOS_ROOT=$RUNNER_TEMP/Qt/5.15.2/ios" >> "$GITHUB_ENV"
      - name: Build iOS simulator app
        if: matrix.target == 'simulator'
        run: bash platform/ios/build.sh simulator
      - name: Launch iOS app on iPhone simulator
        if: matrix.target == 'simulator'
        run: |
          strApp=$(find build/ios-simulator -type d -name wenku8_client.app -print -quit)
          strBundle=$(plutil -extract CFBundleIdentifier raw "$strApp/Info.plist")
          strDevice=$(xcrun simctl list devices available --json | python3 -c \
            'import json, sys; print(next(device["udid"] for device in json.load(sys.stdin)["devices"]["com.apple.CoreSimulator.SimRuntime.iOS-18-5"] if device["name"] == "iPhone 16"))')
          strDiagnostics="$RUNNER_TEMP/ios-smoke"
          mkdir -p "$strDiagnostics"
          strVerifier="$RUNNER_TEMP/verify-ios-screen"
          xcrun swiftc platform/ios/verify_simulator.swift -o "$strVerifier"
          xcrun simctl bootstatus "$strDevice" -b
          strLaunchStamp="$RUNNER_TEMP/ios-launch-stamp"
          touch "$strLaunchStamp"
          saveDiagnostics()
          {
            xcrun simctl spawn "$strDevice" log show --last 5m --style compact --info \
              --predicate 'process == "wenku8_client" OR eventMessage CONTAINS[c] "io.github.lucky-ji.wenku8-reader"' \
              > "$strDiagnostics/simulator.log" 2>&1 || true
            for strLogs in "$HOME/Library/Logs/DiagnosticReports" \
                "$HOME/Library/Developer/CoreSimulator/Devices/$strDevice/data/Library/Logs/CrashReporter"
            do
              if [[ -d "$strLogs" ]]; then
                find "$strLogs" -type f -newer "$strLaunchStamp" \
                  \( -name 'wenku8_client*.ips' -o -name 'wenku8_client*.crash' \) \
                  -exec cp {} "$strDiagnostics/" \;
              fi
            done
          }
          trap saveDiagnostics EXIT
          xcrun simctl install "$strDevice" "$strApp"
          strLaunch=$(SIMCTL_CHILD_QT_LOGGING_RULES='qt.qpa.*=true;qt.eventdispatcher.debug=true' \
            xcrun simctl launch \
            --terminate-running-process --stdout="$strDiagnostics/app-stdout.log" \
            --stderr="$strDiagnostics/app-stderr.log" "$strDevice" "$strBundle")
          echo "$strLaunch"
          nPid=${strLaunch##*: }
          sleep 15
          xcrun simctl io "$strDevice" screenshot "$strDiagnostics/ios-startup.png"
          ps -p "$nPid" -o stat= -o comm=
          if ! "$strVerifier" "$strDiagnostics/ios-startup.png"; then
            sample "$nPid" 3 1 -file "$strDiagnostics/app-sample.txt" || true
            exit 1
          fi
          sleep 45
          ps -p "$nPid" -o stat= -o comm=
      - name: Build unsigned iPhone and iPad app
        if: matrix.target == 'device'
        run: bash platform/ios/build.sh device
      - name: Archive unsigned iPhone and iPad app
        if: matrix.target == 'device'
        run: |
          strApp=$(find build/ios-device -type d -name wenku8_client.app -print -quit)
          strVersion=$(plutil -extract CFBundleShortVersionString raw "$strApp/Info.plist")
          strArchive="$RUNNER_TEMP/wenku8-reader-$strVersion-ios-arm64-unsigned.zip"
          ditto -c -k --sequesterRsrc --keepParent "$strApp" "$strArchive"
          unzip -tq "$strArchive"
          shasum -a 256 "$strArchive"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: matrix.target == 'device'
        with:
          name: ios-arm64-unsigned-${{ github.sha }}
          path: ${{ runner.temp }}/wenku8-reader-*-ios-arm64-unsigned.zip
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always() && matrix.target == 'simulator'
        with:
          name: ios-simulator-startup-${{ github.sha }}
          path: ${{ runner.temp }}/ios-smoke/
          if-no-files-found: ignore
          retention-days: 7
